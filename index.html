<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ATLAS</title>

	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--cyan: #00f6ff;
			--blue: #008cff;
			--purple: #875cff;
			--pink: #ff00c8;
		}

		body {
			min-height: 100vh;
			overflow: hidden;
			background:
				radial-gradient(circle at 50% 45%, rgba(0,160,255,.12), transparent 32%),
				radial-gradient(circle at 20% 20%, rgba(135,92,255,.06), transparent 25%),
				#02050a;
			color: var(--cyan);
			font-family: "Courier New", monospace;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			background:
				linear-gradient(rgba(0,246,255,.025) 1px, transparent 1px),
				linear-gradient(90deg, rgba(0,246,255,.025) 1px, transparent 1px);
			background-size: 50px 50px;
			pointer-events: none;
		}

		.atlas {
			width: 100%;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			position: relative;
		}

		.hud {
			position: fixed;
			width: 45px;
			height: 45px;
			opacity: .7;
		}

		.hud.tl {
			top: 20px;
			left: 20px;
			border-top: 2px solid var(--cyan);
			border-left: 2px solid var(--cyan);
		}

		.hud.tr {
			top: 20px;
			right: 20px;
			border-top: 2px solid var(--cyan);
			border-right: 2px solid var(--cyan);
		}

		.hud.bl {
			bottom: 20px;
			left: 20px;
			border-bottom: 2px solid var(--cyan);
			border-left: 2px solid var(--cyan);
		}

		.hud.br {
			bottom: 20px;
			right: 20px;
			border-bottom: 2px solid var(--cyan);
			border-right: 2px solid var(--cyan);
		}

		.top-status {
			position: fixed;
			top: 25px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 10px;
			letter-spacing: 4px;
			color: rgba(255,255,255,.5);
		}

		.top-status span {
			color: var(--cyan);
		}

		.core {
			width: 210px;
			height: 210px;
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 20px;
		}

		.ring {
			position: absolute;
			border-radius: 50%;
			border: 1px solid rgba(0,246,255,.25);
		}

		.ring.one {
			width: 210px;
			height: 210px;
			border-top-color: var(--cyan);
			border-bottom-color: var(--purple);
			animation: rotate1 14s linear infinite;
		}

		.ring.two {
			width: 180px;
			height: 180px;
			border-left-color: var(--cyan);
			border-right-color: var(--pink);
			animation: rotate2 10s linear infinite;
		}

		.ring.three {
			width: 150px;
			height: 150px;
			border-style: dashed;
			border-color: rgba(0,246,255,.3);
		}

		.core-center {
			width: 95px;
			height: 95px;
			border-radius: 50%;
			border: 2px solid var(--cyan);
			display: flex;
			align-items: center;
			justify-content: center;
			background: radial-gradient(
				circle,
				rgba(0,246,255,.35),
				rgba(0,50,100,.15),
				transparent 70%
			);
			box-shadow:
				0 0 20px rgba(0,246,255,.7),
				inset 0 0 20px rgba(0,246,255,.4);
			animation: pulse 2.5s ease-in-out infinite;
		}

		.core-dot {
			width: 35px;
			height: 35px;
			border-radius: 50%;
			background: var(--cyan);
			box-shadow:
				0 0 15px var(--cyan),
				0 0 35px var(--cyan);
		}

		h1 {
			font-family: Arial, sans-serif;
			font-size: clamp(50px, 8vw, 78px);
			letter-spacing: 18px;
			color: white;
			text-shadow:
				0 0 5px white,
				0 0 15px var(--cyan),
				0 0 35px var(--cyan);
			margin-left: 18px;
		}

		#status {
			margin-top: 25px;
			min-height: 22px;
			font-size: 14px;
			color: white;
			text-shadow: 0 0 10px var(--cyan);
			text-align: center;
		}

		#micButton {
			margin-top: 20px;
			padding: 13px 28px;
			background: rgba(0,246,255,.03);
			color: var(--cyan);
			border: 1px solid var(--cyan);
			font-family: monospace;
			letter-spacing: 2px;
			cursor: pointer;
		}

		#micButton:hover {
			background: var(--cyan);
			color: #001016;
			box-shadow: 0 0 20px var(--cyan);
		}

		#micButton.active {
			background: rgba(0,246,255,.15);
			box-shadow: 0 0 20px rgba(0,246,255,.5);
		}

		.command {
			width: min(90%, 650px);
			margin-top: 20px;
			padding: 15px 18px;
			border: 1px solid rgba(0,246,255,.2);
			background: rgba(0,10,18,.75);
		}

		.command-label {
			font-size: 8px;
			letter-spacing: 2px;
			color: rgba(0,246,255,.5);
			margin-bottom: 7px;
		}

		#commandText {
			color: white;
			min-height: 20px;
		}

		.manual {
			width: min(90%, 650px);
			margin-top: 10px;
			display: flex;
			gap: 7px;
		}

		#commandInput {
			flex: 1;
			padding: 12px;
			background: rgba(0,5,10,.9);
			border: 1px solid rgba(0,246,255,.25);
			outline: none;
			color: white;
			font-family: monospace;
		}

		#commandInput:focus {
			border-color: var(--cyan);
		}

		#commandInput::placeholder {
			color: rgba(255,255,255,.25);
		}

		#sendButton {
			padding: 0 18px;
			background: transparent;
			border: 1px solid var(--cyan);
			color: var(--cyan);
			font-family: monospace;
			cursor: pointer;
		}

		#sendButton:hover {
			background: var(--cyan);
			color: #001016;
		}

		.system-info {
			position: fixed;
			bottom: 25px;
			display: flex;
			gap: 25px;
			font-size: 8px;
			letter-spacing: 2px;
			color: rgba(255,255,255,.35);
		}

		.system-info span {
			color: var(--cyan);
		}

		@keyframes rotate1 {
			from {
				transform: rotate(0);
			}

			to {
				transform: rotate(360deg);
			}
		}

		@keyframes rotate2 {
			from {
				transform: rotate(360deg);
			}

			to {
				transform: rotate(0);
			}
		}

		@keyframes pulse {
			0%, 100% {
				transform: scale(1);
			}

			50% {
				transform: scale(1.05);
			}
		}

		@media (max-width: 700px) {
			.system-info {
				gap: 10px;
				font-size: 7px;
			}

			h1 {
				letter-spacing: 10px;
			}

			.manual {
				width: 90%;
			}
		}
	</style>
</head>

<body>
	<div class="atlas">
		<div class="hud tl"></div>
		<div class="hud tr"></div>
		<div class="hud bl"></div>
		<div class="hud br"></div>

		<div class="top-status">
			SYSTEM: <span id="systemStatus">STARTING</span>
		</div>

		<div class="core">
			<div class="ring one"></div>
			<div class="ring two"></div>
			<div class="ring three"></div>

			<div class="core-center">
				<div class="core-dot"></div>
			</div>
		</div>

		<h1>ATLAS</h1>

		<div id="status">
			Inicializando...
		</div>

		<button id="micButton">
			[ INICIAR SISTEMA ]
		</button>

		<div class="command">
			<div class="command-label">
				ATLAS // VOICE BUFFER
			</div>

			<div id="commandText">
				Aguardando comando...
			</div>
		</div>

		<div class="manual">
			<input
				id="commandInput"
				type="text"
				placeholder="Digite um comando..."
				autocomplete="off"
			>

			<button id="sendButton">
				EXECUTAR
			</button>
		</div>

		<div class="system-info">
			<div>
				VOICE:
				<span id="voiceState">OFFLINE</span>
			</div>

			<div>
				CORE:
				<span>ONLINE</span>
			</div>
		</div>
	</div>

	<script>
		const micButton = document.getElementById("micButton");
		const status = document.getElementById("status");
		const commandText = document.getElementById("commandText");
		const commandInput = document.getElementById("commandInput");
		const sendButton = document.getElementById("sendButton");
		const systemStatus = document.getElementById("systemStatus");
		const voiceState = document.getElementById("voiceState");

		const SpeechRecognition =
			window.SpeechRecognition ||
			window.webkitSpeechRecognition;

		let recognition = null;
		let ouvindo = false;
		let falando = false;
		let iniciando = false;
		let esperandoReinicio = false;
		let timerReinicio = null;
		let ultimoComando = "";
		let ultimoTempo = 0;
		let acordando = false;

		const dialogos = {
			saudacao: [
				"Olá. Sistemas online.",
				"Olá. Estou à sua disposição.",
				"Bom ver você novamente.",
				"Sistema ATLAS online. Como posso ajudar?",
				"Olá. Todos os sistemas estão operacionais."
			],

			acordar: [
				"Estou acordado e pronto.",
				"Sistema iniciado. Estou ouvindo.",
				"ATLAS online. Pode começar.",
				"Inicialização concluída. Em que posso ajudar?",
				"Estou aqui. Todos os sistemas estão funcionando."
			],

			obrigado: [
				"Disponha.",
				"Sempre que precisar.",
				"Não há de quê.",
				"Serviço concluído."
			],

			presente: [
				"Estou aqui.",
				"Sim. Estou ouvindo.",
				"Online e aguardando.",
				"Estou à sua disposição.",
				"Presente."
			],

			identidade: [
				"Eu sou ATLAS, seu assistente virtual.",
				"Meu nome é ATLAS.",
				"ATLAS. Sistema de assistência e automação."
			],

			comoEstou: [
				"Todos os meus sistemas estão operacionais.",
				"Estou funcionando normalmente.",
				"Meu núcleo está estável.",
				"Sistemas online. Sem falhas críticas detectadas."
			],

			oQueFaz: [
				"Posso abrir sites, ouvir comandos e executar tarefas.",
				"Minha função é auxiliar você com comandos, navegação e automação.",
				"Posso executar comandos de voz e abrir suas ferramentas."
			],

			elogio: [
				"Obrigado.",
				"Agradeço.",
				"Registro o elogio."
			],

			humor: [
				"Meu senso de humor ainda está em desenvolvimento.",
				"Posso tentar. Mas não prometo que meus algoritmos sejam engraçados.",
				"Essa foi boa."
			],

			despedida: [
				"Até mais.",
				"Sistema em espera.",
				"Até a próxima.",
				"Entrando em modo de espera."
			],

			ocupado: [
				"Estou executando uma tarefa.",
				"Ainda estou processando a solicitação anterior.",
				"Um momento. Estou terminando a operação."
			]
		};

		function resposta(lista) {
			return lista[Math.floor(Math.random() * lista.length)];
		}

		function normalizar(texto) {
			return texto
				.toLowerCase()
				.normalize("NFD")
				.replace(/[\u0300-\u036f]/g, "")
				.trim();
		}

		function falar(texto, depois) {
			if (!("speechSynthesis" in window)) {
				if (depois) depois();
				return;
			}

			falando = true;

			if (recognition && ouvindo) {
				try {
					recognition.stop();
				} catch (e) {}
			}

			clearTimeout(timerReinicio);

			speechSynthesis.cancel();

			const fala = new SpeechSynthesisUtterance(texto);

			fala.lang = "pt-BR";
			fala.rate = 1;
			fala.pitch = 1;
			fala.volume = 1;

			fala.onstart = () => {
				systemStatus.textContent = "SPEAKING";
				voiceState.textContent = "SPEAKING";
			};

			fala.onend = () => {
				falando = false;

				if (depois) depois();

				if (ouvindo) {
					systemStatus.textContent = "LISTENING";
					voiceState.textContent = "ONLINE";
					reiniciarReconhecimento();
				}
			};

			fala.onerror = () => {
				falando = false;

				if (depois) depois();

				if (ouvindo) {
					reiniciarReconhecimento();
				}
			};

			speechSynthesis.speak(fala);
		}

		function responder(texto) {
			status.textContent = texto;
			commandText.textContent = texto;
			falar(texto);
		}

		function reiniciarReconhecimento() {
			if (!ouvindo || falando || iniciando) return;

			clearTimeout(timerReinicio);

			timerReinicio = setTimeout(() => {
				if (!ouvindo || falando || iniciando) return;

				iniciarReconhecimento();
			}, 900);
		}

		function iniciarReconhecimento() {
			if (!recognition || !ouvindo || falando || iniciando) {
				return;
			}

			iniciando = true;

			try {
				recognition.start();
			} catch (e) {
				iniciando = false;
				reiniciarReconhecimento();
			}
		}

		function pararReconhecimento() {
			clearTimeout(timerReinicio);

			if (!recognition) return;

			try {
				recognition.stop();
			} catch (e) {}

			iniciando = false;
		}

		function processarDialogo(comando) {
			const texto = normalizar(comando);

			if (
				texto === "oi" ||
				texto === "ola" ||
				texto.includes("bom dia") ||
				texto.includes("boa tarde") ||
				texto.includes("boa noite")
			) {
				responder(resposta(dialogos.saudacao));
				return true;
			}

			if (
				texto.includes("voce esta ai") ||
				texto.includes("esta ai") ||
				texto.includes("esta ouvindo")
			) {
				responder(resposta(dialogos.presente));
				return true;
			}

			if (
				texto.includes("quem e voce") ||
				texto.includes("qual seu nome") ||
				texto.includes("seu nome")
			) {
				responder(resposta(dialogos.identidade));
				return true;
			}

			if (
				texto.includes("o que voce faz") ||
				texto.includes("o que voce consegue fazer") ||
				texto.includes("quais suas funcoes")
			) {
				responder(resposta(dialogos.oQueFaz));
				return true;
			}

			if (
				texto.includes("como voce esta") ||
				texto.includes("como esta") ||
				texto.includes("esta tudo bem")
			) {
				responder(resposta(dialogos.comoEstou));
				return true;
			}

			if (
				texto.includes("obrigado") ||
				texto.includes("obrigada") ||
				texto.includes("valeu")
			) {
				responder(resposta(dialogos.obrigado));
				return true;
			}

			if (
				texto.includes("tchau") ||
				texto.includes("ate mais") ||
				texto.includes("vou embora")
			) {
				responder(resposta(dialogos.despedida));
				return true;
			}

			if (
				texto.includes("bom trabalho") ||
				texto.includes("muito bom") ||
				texto.includes("incrivel") ||
				texto.includes("parabens")
			) {
				responder(resposta(dialogos.elogio));
				return true;
			}

			if (
				texto.includes("conte uma piada") ||
				texto.includes("conta uma piada") ||
				texto.includes("me faz rir")
			) {
				responder(resposta(dialogos.humor));
				return true;
			}

			if (
				texto.includes("esta ocupado") ||
				texto.includes("voce esta ocupado")
			) {
				responder(resposta(dialogos.ocupado));
				return true;
			}

			if (
				texto.includes("esta funcionando") ||
				texto.includes("ta funcionando")
			) {
				responder("Sim. Meu núcleo está operacional.");
				return true;
			}

			return false;
		}

		function abrirJanela(nome, url) {
			const largura = Math.min(
				1200,
				screen.availWidth - 80
			);

			const altura = Math.min(
				800,
				screen.availHeight - 80
			);

			const esquerda = Math.max(
				0,
				(screen.availWidth - largura) / 2
			);

			const topo = Math.max(
				0,
				(screen.availHeight - altura) / 2
			);

			const janela = window.open(
				url,
				"ATLAS_" + nome.replace(/\s/g, "_"),
				`width=${largura},height=${altura},left=${esquerda},top=${topo},resizable=yes,scrollbars=yes,toolbar=no,menubar=no,status=no`
			);

			if (janela) {
				try {
					janela.focus();
				} catch (e) {}
			}
		}

		function abrirDestino(nome, url, novaAba) {
			const frases = {
				"ChatGPT": "Abrindo o ChatGPT.",
				"YouTube": "Abrindo o YouTube.",
				"Code": "Abrindo o Code.",
				"Modelador": "Abrindo o modelador.",
				"Gemini": "Abrindo o Gemini.",
				"Editor": "Abrindo o editor.",
				"Documentos": "Abrindo os documentos.",
				"Planilhas": "Abrindo as planilhas.",
				"Apresentações": "Abrindo as apresentações.",
				"Ferrugem": "Abrindo o Rust Playground.",
				"Repositório": "Abrindo o repositório.",
				"Gmail": "Abrindo o Gmail.",
				"Drive": "Abrindo o Google Drive.",
				"Canva": "Abrindo o Canva.",
				"Google": "Abrindo o Google."
			};

			const mensagem =
				frases[nome] || "Executando.";

			status.textContent = mensagem;
			commandText.textContent = mensagem;

			falar(mensagem, () => {
				setTimeout(() => {
					if (novaAba) {
						window.open(url, "_blank");
					} else {
						abrirJanela(nome, url);
					}
				}, 100);
			});
		}

		function executarAcorda() {
			if (acordando) return;

			acordando = true;

			commandText.textContent =
				"ATLAS ACORDA BEBÊ";

			status.textContent =
				"Iniciando ambiente...";

			systemStatus.textContent =
				"AWAKENING";

			falar(resposta(dialogos.acordar), () => {
				setTimeout(() => {
					abrirJanela(
						"Code",
						"https://vscode.dev/"
					);
				}, 300);

				setTimeout(() => {
					abrirJanela(
						"ChatGPT",
						"https://chatgpt.com/"
					);
				}, 1200);

				setTimeout(() => {
					status.textContent =
						"Ambiente pronto.";

					systemStatus.textContent =
						"LISTENING";

					acordando = false;
				}, 1800);
			});
		}

		function executarComando(comando) {
			comando = normalizar(comando);

			if (!comando) return;

			const agora = Date.now();

			if (
				comando === ultimoComando &&
				agora - ultimoTempo < 2500
			) {
				return;
			}

			ultimoComando = comando;
			ultimoTempo = agora;

			if (processarDialogo(comando)) {
				return;
			}

			const novaAba =
				comando.includes("nova aba") ||
				comando.includes("nova guia");

			comando = comando
				.replace("nova aba", "")
				.replace("nova guia", "")
				.trim();

			if (
				comando.includes("chat gpt") ||
				comando.includes("chatgpt")
			) {
				abrirDestino(
					"ChatGPT",
					"https://chatgpt.com/",
					novaAba
				);
				return;
			}

			if (comando.includes("youtube")) {
				abrirDestino(
					"YouTube",
					"https://www.youtube.com/",
					novaAba
				);
				return;
			}

			if (comando.includes("gemini")) {
				abrirDestino(
					"Gemini",
					"https://gemini.google.com/",
					novaAba
				);
				return;
			}

			if (
				comando.includes("modelador") ||
				comando.includes("onshape")
			) {
				abrirDestino(
					"Modelador",
					"https://cad.onshape.com/",
					novaAba
				);
				return;
			}

			if (
				comando === "code" ||
				comando.includes("code")
			) {
				abrirDestino(
					"Code",
					"https://vscode.dev/",
					novaAba
				);
				return;
			}

			if (
				comando.includes("editor") ||
				comando.includes("capcut")
			) {
				abrirDestino(
					"Editor",
					"https://www.capcut.com/editor",
					novaAba
				);
				return;
			}

			if (
				comando.includes("documentos") ||
				comando.includes("documento") ||
				comando.includes("docs")
			) {
				abrirDestino(
					"Documentos",
					"https://docs.google.com/document/",
					novaAba
				);
				return;
			}

			if (
				comando.includes("planilhas") ||
				comando.includes("planilha") ||
				comando.includes("sheets")
			) {
				abrirDestino(
					"Planilhas",
					"https://docs.google.com/spreadsheets/",
					novaAba
				);
				return;
			}

			if (
				comando.includes("apresentacoes") ||
				comando.includes("slides")
			) {
				abrirDestino(
					"Apresentações",
					"https://slides.google.com/",
					novaAba
				);
				return;
			}

			if (
				comando.includes("ferrugem") ||
				comando.includes("rust playground") ||
				comando === "rust"
			) {
				abrirDestino(
					"Ferrugem",
					"https://play.rust-lang.org/",
					novaAba
				);
				return;
			}

			if (
				comando.includes("repositorio") ||
				comando.includes("repositório")
			) {
				abrirDestino(
					"Repositório",
					"https://github.com/",
					novaAba
				);
				return;
			}

			if (
				comando.includes("gmail") ||
				comando.includes("email")
			) {
				abrirDestino(
					"Gmail",
					"https://mail.google.com/",
					novaAba
				);
				return;
			}

			if (comando.includes("drive")) {
				abrirDestino(
					"Drive",
					"https://drive.google.com/",
					novaAba
				);
				return;
			}

			if (comando.includes("canva")) {
				abrirDestino(
					"Canva",
					"https://www.canva.com/",
					novaAba
				);
				return;
			}

			if (comando === "google") {
				abrirDestino(
					"Google",
					"https://www.google.com/",
					novaAba
				);
				return;
			}

			if (
				comando.includes("nova aba") ||
				comando.includes("nova guia")
			) {
				window.open("about:blank", "_blank");
				responder("Nova aba aberta.");
				return;
			}

			responder(
				resposta([
					"Não reconheci esse comando.",
					"Não tenho uma ação associada a isso.",
					"Pode reformular o comando?",
					"Não entendi completamente."
				])
			);
		}

		if (SpeechRecognition) {
			recognition = new SpeechRecognition();

			recognition.lang = "pt-BR";
			recognition.continuous = true;
			recognition.interimResults = false;
			recognition.maxAlternatives = 1;

			recognition.onstart = () => {
				iniciando = false;
				esperandoReinicio = false;

				voiceState.textContent = "ONLINE";
				systemStatus.textContent = "LISTENING";

				micButton.textContent =
					"[ PARAR SISTEMA ]";

				micButton.classList.add("active");

				status.textContent =
					'Estou ouvindo. Diga "Atlas"...';
			};

			recognition.onresult = event => {
				if (falando || !ouvindo) return;

				const resultado =
					event.results[event.results.length - 1];

				if (!resultado || !resultado[0]) {
					return;
				}

				const original =
					resultado[0].transcript.trim();

				const texto = normalizar(original);

				if (!texto) return;

				commandText.textContent = original;

				if (
					texto.includes("atlas acorda bebe") ||
					texto.includes("atlas acorda")
				) {
					executarAcorda();
					return;
				}

				if (!texto.includes("atlas")) {
					return;
				}

				const comando =
					texto.replace(/\batlas\b/g, "").trim();

				if (!comando) {
					responder(resposta(dialogos.presente));
					return;
				}

				executarComando(comando);
			};

			recognition.onerror = event => {
				iniciando = false;

				if (event.error === "not-allowed") {
					ouvindo = false;

					voiceState.textContent = "BLOCKED";
					systemStatus.textContent = "MIC BLOCKED";

					status.textContent =
						"Permita o acesso ao microfone para usar o ATLAS.";

					micButton.textContent =
						"[ INICIAR SISTEMA ]";

					micButton.classList.remove("active");

					return;
				}

				if (event.error === "aborted") {
					if (ouvindo && !falando) {
						reiniciarReconhecimento();
					}

					return;
				}

				if (ouvindo && !falando) {
					reiniciarReconhecimento();
				}
			};

			recognition.onend = () => {
				iniciando = false;

				if (ouvindo && !falando) {
					reiniciarReconhecimento();
					return;
				}

				if (!ouvindo) {
					voiceState.textContent = "OFFLINE";
					systemStatus.textContent = "STANDBY";

					micButton.textContent =
						"[ INICIAR SISTEMA ]";

					micButton.classList.remove("active");
				}
			};
		}

		function ativarSistema() {
			if (!recognition) {
				status.textContent =
					"Seu navegador não suporta reconhecimento de voz.";

				systemStatus.textContent =
					"VOICE ERROR";

				return;
			}

			if (ouvindo) return;

			ouvindo = true;

			micButton.textContent =
				"[ PARAR SISTEMA ]";

			micButton.classList.add("active");

			voiceState.textContent = "STARTING";
			systemStatus.textContent = "STARTING";

			status.textContent =
				"Inicializando sistema de voz...";

			iniciarReconhecimento();
		}

		function desativarSistema() {
			ouvindo = false;

			clearTimeout(timerReinicio);

			if ("speechSynthesis" in window) {
				speechSynthesis.cancel();
			}

			falando = false;

			pararReconhecimento();

			voiceState.textContent = "OFFLINE";
			systemStatus.textContent = "STANDBY";

			micButton.textContent =
				"[ INICIAR SISTEMA ]";

			micButton.classList.remove("active");

			status.textContent =
				"Sistema em espera.";
		}

		micButton.onclick = () => {
			if (ouvindo) {
				desativarSistema();
			} else {
				ativarSistema();
			}
		};

		function executarInput() {
			const texto = commandInput.value.trim();

			if (!texto) return;

			commandText.textContent = texto;

			const comando = normalizar(texto);

			if (
				comando.includes("atlas acorda bebe") ||
				comando.includes("atlas acorda")
			) {
				executarAcorda();
			} else {
				executarComando(comando);
			}

			commandInput.value = "";
		}

		sendButton.onclick = executarInput;

		commandInput.onkeydown = event => {
			if (event.key === "Enter") {
				executarInput();
			}
		};

		document.addEventListener("visibilitychange", () => {
			if (
				document.visibilityState === "visible" &&
				ouvindo &&
				!falando
			) {
				reiniciarReconhecimento();
			}
		});

		window.addEventListener("beforeunload", () => {
			ouvindo = false;

			clearTimeout(timerReinicio);

			if (recognition) {
				try {
					recognition.stop();
				} catch (e) {}
			}

			if ("speechSynthesis" in window) {
				speechSynthesis.cancel();
			}
		});

		window.addEventListener("load", () => {
			setTimeout(() => {
				if (!recognition) {
					status.textContent =
						"Reconhecimento de voz não disponível neste navegador.";

					systemStatus.textContent =
						"VOICE ERROR";

					return;
				}

				ativarSistema();
			}, 800);
		});
	</script>
</body>
</html>
